name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]
        # Skip PRs that only touch changelogs (e.g. release notes)
        paths-ignore:
            - "**/CHANGELOG.md"

env:
    # EU cross-region inference profile — must match the region prefix in AWS_REGION secret (eu-*)
    CLAUDE_MODEL: eu.anthropic.claude-sonnet-5-5

jobs:
    auto-review:
        name: AI Code Review
        if: |
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == 'mendix/web-widgets' &&
            github.event.pull_request.user.login != 'uicontent' &&
            github.event.pull_request.user.login != 'uicontent[bot]' &&
            github.event.pull_request.user.login != 'renovate[bot]' &&
            github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: claude-auto-review-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        permissions:
            contents: read
            pull-requests: write
            id-token: write
            actions: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Configure AWS Credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Minimize older bot comments
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  COMMENTS=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json comments \
                    --jq '.comments[] | select(.author.login == "github-actions") | .id')

                  if [ -z "$COMMENTS" ]; then
                    echo "No bot comments to minimize"
                    exit 0
                  fi

                  for NODE_ID in $COMMENTS; do
                    echo "Minimizing comment: $NODE_ID"
                    gh api graphql -f query='
                      mutation($id: ID!) {
                        minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                          minimizedComment { isMinimized }
                        }
                      }' -f id="$NODE_ID" || echo "Failed to minimize $NODE_ID, continuing..."
                  done

            - name: Run Claude Code Review
              id: review
              uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
              with:
                  use_bedrock: "true"
                  # Public repo: keep the transcript out of logs (do not upload the execution file either)
                  show_full_output: "false"
                  additional_permissions: |
                      actions: read
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}

                      You are reviewing this PR in the mendix/web-widgets monorepo.
                      The PR branch is already checked out in the current working directory.

                      Read these files for full context and review guidelines:
                      - `AGENTS.md` — repo conventions, commands, and constraints
                      - `.agents/skills/code-review/SKILL.md` — complete review checklist and heuristics

                      Follow the skill guidelines precisely. Focus only on changed files in the diff; ignore dist/, lockfiles, and generated files.

                      You are running in CI (GitHub Actions). Use inline comments for line-specific issues and pass `confirmed: true`.
                      Do NOT post the summary comment yourself: return it as the `body` field of the structured output,
                      together with the matching `verdict`. The workflow posts it to the PR.
                  claude_args: >-
                      --model ${{ env.CLAUDE_MODEL }} --max-turns 50 --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(gh run:*),Bash(git log:*),Bash(git diff:*),Bash(ls:*),Bash(find:*),mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob" --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approved","approved_with_suggestions","changes_requested","blocked"]},"body":{"type":"string","description":"Full summary comment in GitHub Markdown, starting with ## AI Code Review"}},"required":["verdict","body"]}'

            # Post the summary from the workflow so a missing review fails the job instead of passing silently
            - name: Post review summary
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
              run: |
                  BODY=$(jq -r '.body // empty' <<< "$REVIEW_OUTPUT")
                  if [ -z "$BODY" ]; then
                    echo "::error::Claude did not return a review summary"
                    exit 1
                  fi

                  echo "Verdict: $(jq -r '.verdict' <<< "$REVIEW_OUTPUT")"
                  printf '%s\n' "$BODY" > "$RUNNER_TEMP/review-summary.md"
                  gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review-summary.md"
